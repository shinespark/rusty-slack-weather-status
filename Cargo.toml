[package]
name = "rusty-slack-weather-status"
version = "0.1.0"
authors = ["shinespark <shnsprk@gmail.com>"]
edition = "2024"

[dependencies]
clap = "~2.27.0"
env_logger = "0.11.9"
lazy_static = "1.4.0"
log = "0.4"
reqwest = { version = "0.12", features = ["json"] }
rust-embed = "8.8.0"
scraper = "0.27.0"
tokio = { version = "1.48", features = ["full"] }
toml = "0.9"

[dev-dependencies]
pretty_assertions = "*"
